{# Search form shared by home & results. Vars: q, category, show_years, year_from, year_to, large, focus #}
<form action="/search" method="get" class="searchbar {{ 'searchbar-lg' if large }}" role="search">
  <label class="searchbar-q">
    <span class="sr-only">Search query</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="field" type="search" name="q" value="{{ q or '' }}" placeholder="e.g. smart home gamification" required {{ 'autofocus' if focus }} autocomplete="off">
  </label>
  <label class="sr-only" for="sb-cat">Category</label>
  <select class="field field-cat" name="category" id="sb-cat">
    <option value="">All categories</option>
    {% for c in categories %}<option value="{{ c }}" {{ 'selected' if category==c }}>{{ c }}</option>{% endfor %}
  </select>
  {% if show_years %}
  <input class="field" type="number" name="year_from" value="{{ year_from }}" placeholder="From" min="1950" max="2100" aria-label="From year">
  <input class="field" type="number" name="year_to" value="{{ year_to }}" placeholder="To" min="1950" max="2100" aria-label="To year">
  {% endif %}
  <button class="btn">Search</button>
</form>
